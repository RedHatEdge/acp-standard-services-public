---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: odf-operator
  namespace: openshift-storage
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  channel: "stable-{{ .Values.convergedStorage.version }}"
  installPlanApproval: Automatic
  name: odf-operator
  source:  {{ $.Values.catalogSource | default "redhat-operators" }}
  sourceNamespace: openshift-marketplace