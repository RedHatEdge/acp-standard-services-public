{{- with .Values.virtualization }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $.Values.namePrefix | default "" }}virtualization
  namespace: openshift-gitops
  labels:
    application: virtualization
spec:
  destination:
    {{- if $.Values.destination }}
    name: {{ $.Values.destination }}
    {{- else }}
    name: ''
    server: https://kubernetes.default.svc
    {{- end }}
  project: default
  syncPolicy:
    automated:
      selfHeal: true
  source:
    repoURL: {{ $.Values.gitRepoURL | default "https://github.com/RedHatEdge/acp-standard-services-public.git" }}
    targetRevision: {{ $.Values.gitBranch | default "main" }}
    path: charts/virtualization
    helm:
      values: |
{{- if $.Values.catalogSource }}     
        catalogSource: {{ $.Values.catalogSource | default "redhat-operators" }}
{{- end }}
        virtualization:
{{- toYaml . | nindent 10 }}
{{- end }}
