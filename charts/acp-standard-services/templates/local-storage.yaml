{{- with .Values.localStorage}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $.Values.namePrefix | default "" }}local-storage
  namespace: openshift-gitops
  labels:
    application: local-storage
spec:
  destination:
    {{- if $.Values.destination }}
    name: {{ $.Values.destination }}
    {{- else }}
    name: ''
    server: https://kubernetes.default.svc
    {{- end }}
  project: default
  syncPolicy:
    automated:
      selfHeal: true
  source:
    repoURL: {{ $.Values.repoURL | default "https://github.com/RedHatEdge/acp-standard-services-public.git" }}
    targetRevision: {{ $.Values.gitBranch | default "main" }}
    path: charts/local-storage
    helm:
      values: |
        localStorage:
{{- toYaml . | nindent 10 }}
{{- end }}